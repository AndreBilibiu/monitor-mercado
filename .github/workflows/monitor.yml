name: Monitor de mercado

on:
  schedule:
    - cron: "*/10 * * * *" # a cada 10 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: write # necessário para salvar o estado.json (memória dos alertas)

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checar mercado
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node monitor.mjs --uma-vez

      - name: Salvar estado dos alertas
        run: |
          if [ -n "$(git status --porcelain estado.json)" ]; then
            git config user.name "monitor-bot"
            git config user.email "monitor-bot@users.noreply.github.com"
            git add estado.json
            git commit -m "Atualiza estado dos alertas"
            git push
          fi
